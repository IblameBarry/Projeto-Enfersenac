<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Atendimento - Senac</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Ícones Phosphor / Boxicons (opcional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="layout-container">
    
    <!-- LADO ESQUERDO: APRESENTAÇÃO / ILUSTRAÇÃO -->
    <aside class="left-panel">
      <div class="left-content">
        <!-- Logo Topo Esquerda -->
        <header class="panel-header">
          <img src="/img/logo_SenacF.png" alt="Senac Fecomércio" class="logo-top">
        </header>

        <!-- Títulos -->
        <div class="panel-intro">
          <h1 class="title">Portal de<br>Atendimento</h1>
          <div class="divider-line"></div>
          <p class="subtitle">
            Sistema integrado para gestão de atendimentos em unidades de saúde Senac.
          </p>
        </div>

        <!-- Ilustração do Prédio -->
        <div class="illustration-wrapper">
          <img src="/img/predio.png" alt="Unidade Senac" class="building-img">
        </div>

        <!-- Linhas decorativas e rodapé -->
        <footer class="panel-footer">
          <div class="accent-lines">
            <span class="line-thick"></span>
            <span class="line-thin"></span>
          </div>
          <p class="copyright">© 2025 Senac - Saúde e Bem-Estar</p>
        </footer>
      </div>
    </aside>

    <!-- LADO DIREITO: SELEÇÃO DE PERFIL -->
    <main class="right-panel">
      <div class="card-login">
        <!-- Barra colorida no topo do card -->
        <div class="card-top-bar">
          <span class="bar-blue"></span>
          <span class="bar-orange"></span>
        </div>

        <div class="card-body">
          <h2 class="card-title">Acesse o seu perfil</h2>
          <p class="card-subtitle">Selecione seu perfil para continuar</p>

          <!-- Botões de Seleção -->
          <div class="profile-options">
            <!-- Opção Professor -->
            <a href="/login-professor.html" class="profile-card">
              <div class="profile-icon">
                <i class="fa-solid fa-chalkboard-user"></i>
              </div>
              <div class="profile-info">
                <strong class="profile-name">Professor</strong>
                <span class="profile-desc">Acesso ao painel docente</span>
              </div>
              <span class="profile-arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <!-- Opção Aluno -->
            <a href="/login-aluno.html" class="profile-card">
              <div class="profile-icon">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <div class="profile-info">
                <strong class="profile-name">Aluno</strong>
                <span class="profile-desc">Acesso ao portal do estudante</span>
              </div>
              <span class="profile-arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </a>
          </div>
        </div>
      </div>

      <!-- Rodapé do lado direito -->
      <div class="right-footer">
        <span class="version-text">Portal de Atendimento v2.4.1</span>
        <img src="/img/Logo_senac.png" alt="Senac" class="footer-logo">
      </div>
    </main>

  </div>
</body>
</html>
